name: Build and Deploy Documentation

on:
  push:
    branches:
      - master
      - development
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Create docs directory structure
        run: |
          mkdir -p docs/_build/doxygen
          mkdir -p docs/_static
          mkdir -p docs/_templates
          mkdir -p docs/api
          echo "✓ Created all required directories"
          ls -la docs/

      - name: Build Doxygen XML
        run: |
          echo "Running Doxygen from root directory..."
          echo "Doxygen version:"
          doxygen --version
          echo ""
          echo "Output directory will be: ./docs/_build/doxygen"
          ls -la docs/_build/
          doxygen Doxyfile
          
          # Critical check for index.xml
          if [ ! -f docs/_build/doxygen/xml/index.xml ]; then
            echo "✗ ERROR: index.xml not found!"
            echo "Contents of xml directory:"
            ls -la docs/_build/doxygen/xml/ || echo "No xml directory"
            exit 1
          fi
          
          echo "✓ Doxygen XML generated successfully"
          ls -la docs/_build/doxygen/xml/ | head -20

      - name: Build Sphinx HTML
        run: |
          cd docs
          
          # Clear Breathe and Sphinx caches to prevent stale data
          rm -rf .doctrees 2>/dev/null || true
          rm -rf _build/.doctrees 2>/dev/null || true
          
          echo "Building Sphinx from docs directory..."
          sphinx-build -b html -W . _build/html 2>&1 | tee build.log
          
          if grep -i "error\|failed" build.log; then
            echo "Build completed with errors"
            exit 1
          fi
          echo "✓ Sphinx HTML build successful"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/_build/html'

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3