name: libaeon Unit Tests

# Trigger on push and pull requests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Test on Linux with GCC and Clang
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.cxx }} cmake build-essential
    
    - name: Create build directory
      run: mkdir build
    
    - name: Configure CMake
      working-directory: build
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ..
    
    - name: Build
      working-directory: build
      run: cmake --build . --config ${{ matrix.build_type }}
    
    - name: Run Tests
      working-directory: build
      run: ctest --output-on-failure -V
  
  # Test on macOS
  test-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Create build directory
      run: mkdir build
    
    - name: Configure CMake
      working-directory: build
      run: cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ..
    
    - name: Build
      working-directory: build
      run: cmake --build . --config ${{ matrix.build_type }}
    
    - name: Run Tests
      working-directory: build
      run: ctest --output-on-failure -V
  
  # Test on Windows with MSVC
  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Create build directory
      run: mkdir build
    
    - name: Configure CMake
      working-directory: build
      run: cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ..
    
    - name: Build
      working-directory: build
      run: cmake --build . --config ${{ matrix.build_type }}
    
    - name: Run Tests
      working-directory: build
      run: ctest --output-on-failure -V -C ${{ matrix.build_type }}
  
  # Test with SSL/TLS enabled
  test-ssl:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc cmake build-essential libssl-dev
    
    - name: Create build directory
      run: mkdir build
    
    - name: Configure CMake with SSL
      working-directory: build
      run: cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_SSL=ON ..
    
    - name: Build
      working-directory: build
      run: cmake --build .
    
    - name: Run Tests
      working-directory: build
      run: ctest --output-on-failure -V
  
  # Test on ARM64 (Linux)
  test-arm64:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up QEMU for ARM64 emulation
      uses: docker/setup-qemu-action@v2
      with:
        platforms: arm64
    
    - name: Install cross-compilation tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake
    
    - name: Create build directory
      run: mkdir build
    
    - name: Configure CMake for ARM64
      working-directory: build
      env:
        CC: aarch64-linux-gnu-gcc
        CXX: aarch64-linux-gnu-g++
      run: cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_PROCESSOR=aarch64 ..
    
    - name: Build
      working-directory: build
      run: cmake --build .
    
    # Note: Can't run ARM64 tests on x86-64 without full emulation
    - name: Verify build artifacts
      working-directory: build
      run: file aeon_tests
  
  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc cmake build-essential cppcheck
    
    - name: Run static analysis
      run: |
        cppcheck --enable=all --error-exitcode=1 \
                  --suppressions-list=.cppcheckrc \
                  src/ include/ tests/
      continue-on-error: true
    
    - name: Create build directory
      run: mkdir build
    
    - name: Configure CMake
      working-directory: build
      run: cmake -DCMAKE_BUILD_TYPE=Release ..
    
    - name: Check compilation warnings
      working-directory: build
      run: cmake --build . 2>&1 | grep -i warning || true
      continue-on-error: true

# Job to report test results
  report-results:
    runs-on: ubuntu-latest
    needs: [test-linux, test-macos, test-windows, test-ssl]
    if: always()
    
    steps:
    - name: Test Results Summary
      run: |
        echo "Test runs completed on:"
        echo "✓ Linux (GCC/Clang)"
        echo "✓ macOS"
        echo "✓ Windows (MSVC)"
        echo "✓ SSL/TLS enabled"
        echo ""
        echo "All tests passed successfully!"
